name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # npm rejects provenance built on self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for publish rights.
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag must match the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME implies $TAG_VERSION, package.json says $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing @atelia/mastra-swarm@$PKG_VERSION"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify the tarball contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          FILES="$(node -p "require('/tmp/pack.json')[0].files.map(f => f.path).join('\n')")"
          echo "$FILES"
          for required in LICENSE README.md package.json dist/index.js dist/index.cjs dist/index.d.ts dist/index.d.cts; do
            echo "$FILES" | grep -qxF "$required" || { echo "missing from tarball: $required" >&2; exit 1; }
          done
          echo "$FILES" | grep -qE '^(src|test|examples)/' && { echo "source leaked into the tarball" >&2; exit 1; }
          exit 0

      # Checked, not upgraded: installing npm@latest here would run an unpinned package in a job that can publish.
      - name: npm must support trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          MAJOR="${NPM_VERSION%%.*}"
          if [ "$MAJOR" -lt 11 ]; then
            echo "npm $NPM_VERSION cannot authenticate via OIDC; needs 11.5.1 or newer" >&2
            exit 1
          fi

      # No NPM_TOKEN on purpose: npm prefers a token when present, which would bypass trusted publishing.
      - name: Publish
        run: npm publish
