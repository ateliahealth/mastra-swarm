name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mastra:
          - { core: 1.63.2, memory: 1.28.1 }
          - { core: latest, memory: latest }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @mastra/core@${{ matrix.mastra.core }} @mastra/memory@${{ matrix.mastra.memory }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
